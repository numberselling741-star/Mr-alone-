let s0="dash";try{s0=sessionStorage.getItem("sec")||"dash"}catch(e){}showSec(s0);
/* ---------- data ---------- */
const MIG={channels:"ch",links:"l",photos:"p",banners:"b",courses:"c",tilawat:"t"};
function migrate(){Object.entries(MIG).forEach(([k,p])=>{S[k]=(S[k]||[]).map((x,i)=>x.id?x:{...x,id:p+Date.now().toString(36)+i})})}
function draw(){Object.values(CR).forEach(C=>C.draw());fillCfg();drawCP();$("ab").value=S.audio?S.audio.bismillah:DA.bismillah;$("as").value=S.audio?S.audio.base:DA.base;[["s1","used"],["s2","seen"]].forEach(([i,f])=>$(i).value=S.stats?.[f]||"");drawD();syncImg()}
$("go").onclick=()=>signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(e=>$("err").textContent=e.code);
$("out").onclick=async()=>{await log("Admin logout");signOut(auth)};
onAuthStateChanged(auth,async u=>{$("login").classList.toggle("hide",!!u);$("panel").classList.toggle("hide",!u);
if(u)$("dbg").textContent="Admin UID: "+u.uid+"\n";if(u&&!rOn){rOn=true;log("Admin login");onSnapshot(collection(db,"reviews"),s=>{RV=s.docs.map(d=>({id:d.id,...d.data()}));drawR()},err("reviews"));onSnapshot(collection(db,"members"),s=>{MB=s.docs.map(d=>({id:d.id,...d.data()}));drawM()},err("members"));onSnapshot(collection(db,"requests"),s=>{RQ=s.docs.map(d=>({id:d.id,...d.data()}));drawQ();drawD()},err("requests"));onSnapshot(collection(db,"cviews"),s=>{CVM={};CVT=s.docs.reduce((t,d)=>{CVM[d.id]=d.data().n||0;return t+(d.data().n||0)},0);drawD()},err("cviews"));onSnapshot(collection(db,"lclicks"),s=>{LCT=0;LCM={};s.docs.forEach(d=>{LCM[d.id]=d.data().n||0;LCT+=d.data().n||0});drawD();CR.tools.draw()},err("lclicks"));onSnapshot(collection(db,"daily"),s=>{DY={};s.docs.forEach(d=>DY[d.id]=d.data());drawA()},err("daily"));onSnapshot(collection(db,"logs"),s=>{LG=s.docs.map(d=>d.data()).sort((x,y)=>y.t-x.t).slice(0,30);drawG()},err("logs"));onSnapshot(collection(db,"tickets"),s=>{TKA=s.docs.map(d=>({id:d.id,...d.data()}));drawT()},err("tickets"));onSnapshot(collection(db,"bills"),s=>{BLA=s.docs.map(d=>({id:d.id,...d.data()}));drawB()},err("bills"));onSnapshot(collection(db,"appeals"),s=>{APA=s.docs.map(d=>({id:d.id,...d.data()}));drawAP()},err("appeals"));getDoc(doc(db,"site","counter")).then(s=>{VT=s.exists()?s.data().n:0;drawD()}).catch(()=>{})}
if(u){const s=await getDoc(ref);if(s.exists())S={...S,...s.data()};migrate();draw()}});
/* ---------- analytics, dashboard ---------- */
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);o.push(d)}return o}
function bars(t,v,l){const m=Math.max(1,...v);return `<div class="glass rv"><b>${t}</b> <small style="color:var(--m)">(total ${v.reduce((x,y)=>x+y,0)})</small><div style="display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px">${v.map((n,i)=>`<div title="${l[i]}: ${n}" style="flex:1;background:var(--g);height:${Math.max(3,n/m*100)}%;border-radius:3px"></div>`).join("")}</div></div>`}
function drawA(){const D=days(14),K=D.map(key),L=D.map(d=>d.getDate()+"/"+(d.getMonth()+1)),by=(arr)=>K.map(k=>arr.filter(x=>x.ts&&key(new Date(x.ts))===k).length);
const vs=K.map(k=>(DY[k]||{}).n||0),un=K.map(k=>(DY[k]||{}).u||0),sum=n=>days(n).map(key).reduce((t,k)=>t+((DY[k]||{}).n||0),0);
const top=o=>Object.entries(o).sort((x,y)=>y[1]-x[1]),cn=id=>(S.courses.find(c=>c.id===id)||{}).name||id,ln=id=>((S.links||[]).find(l=>l.id===id)||{}).title||id;
const rc={},cats={};RQ.forEach(r=>{rc[r.cid]=(rc[r.cid]||0)+1;const c=S.courses.find(x=>x.id===r.cid);if(c&&c.cat)cats[c.cat]=(cats[c.cat]||0)+1});
const tc=top(CVM),tr=top(rc),tl=top(LCM),tk=top(cats),uall=Object.values(DY).reduce((t,d)=>t+(d.u||0),0);
$("an").innerHTML=bars("Daily visitors (14 days)",vs,L)+bars("Unique visitors",un,L)+bars("New users",by(MB),L)+bars("Course requests",by(RQ),L)+bars("Reviews",by(RV),L)+`<div class="glass rv" style="line-height:1.8">Visitors: today ${vs[13]} · 7 days ${sum(7)} · 30 days ${sum(30)} · unique (all time) ${uall}<br>🔥 Most viewed course: ${tc[0]?esc(cn(tc[0][0]))+" ("+tc[0][1]+")":"-"}<br>⭐ Most requested: ${tr[0]?esc(cn(tr[0][0]))+" ("+tr[0][1]+")":"-"}<br>🏷 Popular category: ${tk[0]?esc(tk[0][0]):"-"}<br>🔗 Most clicked tool: ${tl[0]?esc(ln(tl[0][0]))+" ("+tl[0][1]+")":"-"}<br><small style="color:var(--m)">Course views: ${tc.slice(0,10).map(([i,n])=>esc(cn(i))+" "+n).join(" · ")||"-"}</small></div>`}
function drawG(){$("lgl").innerHTML=LG.map(l=>`<div class="row"><span>${esc(l.a)}<br><small style="color:var(--m)">${new Date(l.t).toLocaleString()} · ${esc((l.u||"").slice(0,6))}…</small></span></div>`).join("")||"<small>No activity yet</small>"}
function drawD(){const t0=new Date();t0.setHours(0,0,0,0);const c=x=>RQ.filter(r=>r.status===x).length;
const d=[["Users",MB.length],["New today",MB.filter(m=>m.ts>=t0.getTime()).length],["Courses",S.courses.length],["Course views",CVT],["Visitors",VT],["Tool clicks",LCT],["Requests",RQ.length],["Pending",c("pending")],["Approved",c("approved")],["Rejected",c("rejected")],["Completed",c("completed")],["Reviews",RV.length],["Open tickets",TKA.filter(t=>t.status==="open").length],["Appeals",APA.filter(x=>x.status==="pending").length],["Unpaid bills",BLA.filter(b=>b.status!=="paid").length],["Pending reviews",RV.filter(r=>r.status!=="approved").length]];
$("dash").innerHTML=d.map(([l,v])=>`<div class="glass st"><b>${v}</b><span>${l}</span></div>`).join("");
const pm=MB.filter(m=>m.status==="pending").length,pr=c("pending"),pv=RV.filter(r=>r.status!=="approved").length,pt=TKA.filter(t=>t.status==="open").length,pa=APA.filter(x=>x.status==="pending").length;
$("alr").innerHTML=(pm||pr||pv||pt||pa)?`<div class="glass rv" style="border-color:var(--g)">🔔 Waiting: ${pm} join request(s), ${pr} course request(s), ${pv} review(s), ${pt} ticket(s), ${pa} appeal(s)</div>`:"";drawA()}
/* ---------- requests, billing, members, appeals, tickets ---------- */
function drawQ(){const f=$("rf").value;$("rq").innerHTML=[...RQ].filter(r=>!f||r.status===f).sort((a,b)=>b.ts-a.ts).map(r=>`<div class="row" style="flex-wrap:wrap"><span><b>${esc(r.course)}</b> ${esc(r.price)}<br>${esc(r.name)} · ${esc(r.email)}<br><small>${esc(r.rid)} · ${new Date(r.ts).toLocaleString()} · <b>${esc(r.status)}</b>${r.coupon?" · "+esc(r.coupon)+" → "+esc(r.paid):""}<br>${(r.hist||[]).map(h=>esc(h.s)+" "+new Date(h.t).toLocaleDateString()).join(" → ")}</small></span>${["approved","rejected","completed"].filter(x=>x!==r.status).map(x=>`<button class="btn ${x==="approved"?"gold":""}" data-q="${x}" data-id="${esc(r.id)}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}${r.status==="approved"||r.status==="completed"?`<button class="btn" data-bill="${esc(r.id)}">Create bill</button>`:""}</div>`).join("")||"<small>No requests</small>"}
$("rf").onchange=drawQ;
document.addEventListener("click",async e=>{const b=e.target.closest("[data-q]");if(!b)return;const r=RQ.find(x=>x.id===b.dataset.id);if(!r)return;try{await updateDoc(doc(db,"requests",r.id),{status:b.dataset.q,hist:[...(r.hist||[]),{s:b.dataset.q,t:Date.now()}]});log("Request "+r.rid+" -> "+b.dataset.q);await addDoc(collection(db,"notes"),{to:r.uid,title:"Request "+b.dataset.q,text:"Your request for "+r.course+" is "+b.dataset.q+".",ts:Date.now()})}catch(x){alert("Failed: "+x.code)}});
function num2(v){return parseFloat(String(v||"").replace(/[^\d.]/g,""))||0}
function drawB(){const P=BLA.filter(b=>b.status==="paid").reduce((t,b)=>t+num2(b.amount),0),U=BLA.filter(b=>b.status!=="paid").reduce((t,b)=>t+num2(b.amount),0);
$("bll").innerHTML=`<small style="color:var(--m)">Paid total: ${P} · Unpaid total: ${U}</small>`+[...BLA].sort((x,y)=>y.ts-x.ts).map(b=>`<div class="row"><span><b>${esc(b.no)}</b> · ${esc(b.status)}<br><small>${esc(b.name)} · ${esc(b.course)} · ${esc(b.amount)}</small></span><button class="btn gold" data-bs="${b.id}">${b.status==="paid"?"Mark unpaid":"Mark paid"}</button><button class="btn" data-bd="${b.id}">🗑</button></div>`).join("");drawD()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-bs],[data-bd],[data-bill]");if(!b)return;try{
if(b.dataset.bill){const q=RQ.find(x=>x.id===b.dataset.bill);if(!q)return;const no="INV-"+Date.now().toString(36).toUpperCase();await addDoc(collection(db,"bills"),{uid:q.uid,name:q.name,email:q.email,course:q.course,amount:q.paid||q.price||"",status:"unpaid",no,note:"",ts:Date.now()});await addDoc(collection(db,"notes"),{to:q.uid,title:"New bill "+no,text:q.course+" - "+(q.paid||q.price||""),ts:Date.now()});log("Bill created: "+no);alert("Bill "+no+" created")}
else{const x=BLA.find(y=>y.id===(b.dataset.bs||b.dataset.bd));if(!x)return;if(b.dataset.bs){await updateDoc(doc(db,"bills",x.id),{status:x.status==="paid"?"unpaid":"paid"});log("Bill "+x.no+" status changed")}else if(confirm("Delete this bill?")){await deleteDoc(doc(db,"bills",x.id));log("Bill deleted: "+x.no)}}
}catch(x){alert("Failed: "+x.code)}});
function drawM(){const f=m=>`<div class="row">${iu("img:"+m.id+"_dp")?`<img class="thm" style="border-radius:50%" alt="" src="${esc(iu("img:"+m.id+"_dp"))}">`:""}<span><b>${esc(m.name)}</b>${m.username?" @"+esc(m.username):""}<br>${esc(m.email)} · ${esc(m.status)}</span>${m.status!=="approved"?`<button class="btn gold" data-m="ok" data-id="${m.id}">${m.status==="disabled"?"Enable":"Approve"}</button>`:""}${m.status==="approved"?`<button class="btn" data-m="dis" data-id="${m.id}">Disable</button>`:""}${m.status!=="rejected"?`<button class="btn" data-m="no" data-id="${m.id}">${m.status==="approved"?"Remove":"Reject"}</button>`:""}</div>`;
const P=MB.filter(m=>m.status==="pending");$("mp").innerHTML=`<b>Join requests (${P.length})</b>${P.map(f).join("")}<br><b>Other members (${MB.length-P.length})</b>${MB.filter(m=>m.status!=="pending").map(f).join("")}`;drawD()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;try{await updateDoc(doc(db,"members",b.dataset.id),{status:b.dataset.m==="ok"?"approved":b.dataset.m==="dis"?"disabled":"rejected"});log("Member "+b.dataset.id.slice(0,6)+" -> "+b.dataset.m)}catch(x){alert("Failed: "+x.code)}});
function drawAP(){$("apl2").innerHTML=[...APA].sort((x,y)=>y.ts-x.ts).map(p=>`<div class="row"><span><b>${esc(p.name)}</b> · ${esc(p.status)}<br><small>${esc(p.email)}</small><br>${esc(p.text)}</span>${p.status==="pending"?`<button class="btn gold" data-ap="ok" data-id="${p.id}">Approve</button><button class="btn" data-ap="no" data-id="${p.id}">Reject</button>`:""}</div>`).join("")||"<small>No appeals</small>";drawD()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-ap]");if(!b)return;const id=b.dataset.id;try{if(b.dataset.ap==="ok"){await updateDoc(doc(db,"appeals",id),{status:"approved"});await updateDoc(doc(db,"members",id),{status:"approved"});await addDoc(collection(db,"notes"),{to:id,title:"Appeal approved",text:"Your account is active again.",ts:Date.now()})}else await updateDoc(doc(db,"appeals",id),{status:"rejected"});log("Appeal "+b.dataset.ap+" "+id.slice(0,6))}catch(x){alert("Failed: "+x.code)}});
function drawT(){$("tkl").innerHTML=[...TKA].sort((x,y)=>y.ts-x.ts).map(t=>`<div class="row" style="flex-wrap:wrap"><span><b>${esc(t.subject)}</b> · ${esc(t.status)}<br><small>${esc(t.name)} · ${esc(t.email)}</small><br>${esc(t.text)}${t.reply?`<br><i style="color:var(--g)">↳ ${esc(t.reply)}</i>`:""}</span><input style="flex-basis:100%" placeholder="Write a reply" data-rin="${t.id}"><button class="btn gold" data-tr="${t.id}">Reply</button><button class="btn" data-tc="${t.id}">Close</button></div>`).join("")||"<small>No tickets</small>";drawD()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-tr],[data-tc]");if(!b)return;const id=b.dataset.tr||b.dataset.tc,t=TKA.find(x=>x.id===id);if(!t)return;
try{if(b.dataset.tr){const v=document.querySelector('[data-rin="'+id+'"]').value.trim();if(!v)return;await updateDoc(doc(db,"tickets",id),{reply:v,status:"answered"});await addDoc(collection(db,"notes"),{to:t.uid,title:"Support replied",text:t.subject+": "+v,ts:Date.now()});log("Ticket answered")}else{await updateDoc(doc(db,"tickets",id),{status:"closed"});log("Ticket closed")}}catch(x){alert("Failed: "+x.code)}});
/* ---------- offers ---------- */
$("cp_add").onclick=()=>{const c=$("cp_code").value.trim().toUpperCase();if(!c)return;S.coupons=[...(S.coupons||[]),{code:c,type:$("cp_type").value,val:$("cp_val").value,exp:$("cp_exp").value,max:$("cp_max").value,on:true}];["cp_code","cp_val","cp_exp","cp_max"].forEach(i=>$(i).value="");log("Coupon added: "+c);save()};
function drawCP(){$("cpl").innerHTML=(S.coupons||[]).map((c,i)=>`<div class="row"><span>${esc(c.code)} · ${c.type==="fixed"?"-"+esc(c.val):esc(c.val)+"%"}${c.exp?" · exp "+esc(c.exp):""}${c.max?" · max "+esc(c.max):""}${c.on===false?" · off":""}</span><button class="btn" data-cx="${i}">${c.on===false?"On":"Off"}</button><button class="btn" data-cy="${i}">🗑</button></div>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-cx],[data-cy]");if(!b)return;if(b.dataset.cx!==undefined){const c=S.coupons[+b.dataset.cx];c.on=c.on===false}else S.coupons.splice(+b.dataset.cy,1);save()});
$("nt_send").onclick=async()=>{const t=$("nt_t").value.trim();if(!t)return;try{await addDoc(collection(db,"notes"),{to:"all",title:t,text:$("nt_x").value,ts:Date.now()});log("Notification sent: "+t);$("nt_t").value=$("nt_x").value="";alert("Sent to all members")}catch(e){alert("Failed: "+e.code)}};
/* ---------- backup ---------- */
async function dump(c){const s=await getDocs(collection(db,c));return s.docs.map(d=>({id:d.id,...d.data()}))}
$("bk_go").onclick=async()=>{const w=$("bk_sel").value;try{const o={exported:new Date().toISOString()};
if(w==="all"||w==="site"){o.site=S;o.courseAccess=await dump("courseAccess");o.images=await dump("images")}
if(w==="all"||w==="users")o.members=await dump("members");
if(w==="all"||w==="requests")o.requests=await dump("requests");
if(w==="all"||w==="reviews")o.reviews=await dump("reviews");
if(w==="all"||w==="analytics"){o.daily=await dump("daily");o.cviews=await dump("cviews");o.lclicks=await dump("lclicks")}
const el=document.createElement("a");el.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));el.download="mr-alone-"+w+"-"+key(new Date())+".json";el.click();log("Export: "+w)}catch(e){alert("Export failed: "+(e.code||e.message))}};
$("bk_rs").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!confirm("Restore site content from this backup? This replaces current content."))return;try{const o=JSON.parse(await f.text());if(!o.site)throw new Error("not a site backup");for(const x of(o.images||[]))await setDoc(doc(db,"images",x.id),{d:x.d,ts:x.ts||Date.now()});S={...S,...o.site};await setDoc(ref,S);for(const x of(o.courseAccess||[]))await setDoc(doc(db,"courseAccess",x.id),{link:x.link||""});log("Site restored from backup");migrate();draw();alert("Restored")}catch(x){alert("Restore failed: "+(x.code||x.message))}};
$("img_clean").onclick=async()=>{if(!confirm("Delete images that are no longer used anywhere on the website? Save all your changes first."))return;try{const used=new Set((JSON.stringify(S).match(/img:[A-Za-z0-9_]+/g)||[]).map(x=>x.slice(4)));RV.forEach(r=>{if(r.img)used.add(String(r.img).slice(4))});let n=0;for(const x of await dump("images")){if(x.id[0]==="a"&&x.id.indexOf("_")<0&&!used.has(x.id)){await deleteDoc(doc(db,"images",x.id));n++}}log("Unused images deleted: "+n);alert(n+" unused image(s) deleted")}catch(e){alert("Failed: "+(e.code||e.message))}};
</script></body></html>
