<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mr Alone Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><div class="wrap">
<div id="login" class="glass" style="padding:24px;margin-top:60px"><div class="logo" style="margin-bottom:14px">ADMIN LOGIN</div>
<div class="f"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn gold" id="go">Login</button><small id="err" style="color:#ff8a8a"></small></div></div>
<div id="panel" class="hide"><header class="glass"><div class="logo">ADMIN</div><button class="btn" id="out">Logout</button></header>
<pre id="dbg" style="color:#ff8a8a;white-space:pre-wrap;font-size:12px"></pre><h2>Dashboard</h2><div class="stats" id="dash"></div><h2>Tilawat</h2><div class="f"><input id="ab" placeholder="Bismillah audio link (mp3)"><input id="as" placeholder="Surah folder link ending with / (files 001.mp3 ... 114.mp3)"><button class="btn gold" id="au2">Save audio</button></div><div class="f"><input id="tt" placeholder="Title"><input id="tu" placeholder="Link"><button class="btn gold" id="ta">Add</button></div><div id="tlist"></div>
<h2>Channels</h2><div class="f"><input id="cn" placeholder="Name"><input id="cu" placeholder="Link"><input id="cd" placeholder="DP image link"><button class="btn gold" id="ca">Add</button></div><div id="clist"></div>
<h2>Courses</h2><div class="f"><input id="kn" placeholder="Course name"><input id="ks" placeholder="Short description"><textarea id="kdt" rows="3" placeholder="Complete details"></textarea><input id="kp" placeholder="Price (e.g. Rs 999)"><input id="ko" placeholder="Old price (optional)"><input id="kc" placeholder="Category"><input id="kdu" placeholder="Duration (e.g. 4 weeks)"><input id="kv" placeholder="Level (Beginner / Advanced)"><textarea id="klr" rows="3" placeholder="What you will learn"></textarea><textarea id="krq" rows="2" placeholder="Requirements"></textarea><input id="kth" placeholder="Thumbnail image link"><input id="kl" placeholder="Course link (private, shown only after approval)"><input id="kw" placeholder="Your number / WhatsApp link"><select id="kst"><option value="active">Published</option><option value="hidden">Hidden</option></select><label><input id="kf" type="checkbox" style="width:auto"> Featured</label><button class="btn gold" id="ka">Add Course</button></div><div id="klist"></div>
<h2>Banners</h2><div class="f"><input id="bt" placeholder="Banner title"><input id="bx" placeholder="Banner text"><input id="bi" placeholder="Background image link (optional)"><button class="btn gold" id="ba">Add</button></div><div id="blist"></div><h2>Requests</h2><select id="rf"><option value="">All</option><option>pending</option><option>approved</option><option>rejected</option><option>completed</option></select><div id="rq"></div><h2>Members</h2><div id="mp"></div><h2>Reviews</h2><div id="rp"></div><h2>Numbers</h2><div class="f"><input id="s1" type="number" placeholder="Users"><input id="s2" type="number" placeholder="Seen"><button class="btn gold" id="sv">Save numbers</button></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,onSnapshot,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,"site","main"),$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const err=n=>e=>{$("dbg").textContent+=n+" error: "+(e.code||e.message)+"\n"};
let S={tilawat:[],channels:[],courses:[],banners:[],stats:{}},RV=[],MB=[],RQ=[],CVT=0,VT=0,editId=null,rOn=false;
const save=async()=>{try{await setDoc(ref,S)}catch(e){alert("Save failed: "+e.code)}draw()};
function draw(){const L=(k,f)=>S[k].map((x,i)=>`<div class="row"><span>${esc(f(x))}</span><button class="btn" data-k="${k}" data-i="${i}">🗑</button></div>`).join("");
$("tlist").innerHTML=L("tilawat",x=>x.title);$("ab").value=S.audio?S.audio.bismillah:DA.bismillah;$("as").value=S.audio?S.audio.base:DA.base;$("clist").innerHTML=L("channels",x=>x.name);$("blist").innerHTML=L("banners",x=>x.title);$("klist").innerHTML=S.courses.map(c=>`<div class="row"><span>${esc(c.name)} — ${esc(c.price)} · ${esc(c.status||"active")}</span><button class="btn" data-ce="${c.id}">Edit</button><button class="btn" data-ch="${c.id}">${c.status==="hidden"?"Show":"Hide"}</button><button class="btn" data-cd="${c.id}">🗑</button></div>`).join("");drawD();
[["s1","used"],["s2","seen"]].forEach(([i,f])=>$(i).value=S.stats?.[f]||"")}
$("go").onclick=()=>signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(e=>$("err").textContent=e.code);
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$("login").classList.toggle("hide",!!u);$("panel").classList.toggle("hide",!u);
if(u)$("dbg").textContent="Admin UID: "+u.uid+"\n";if(u&&!rOn){rOn=true;onSnapshot(collection(db,"reviews"),s=>{RV=s.docs.map(d=>({id:d.id,...d.data()}));drawR()},err("reviews"));onSnapshot(collection(db,"members"),s=>{MB=s.docs.map(d=>({id:d.id,...d.data()}));drawM()},err("members"));onSnapshot(collection(db,"requests"),s=>{RQ=s.docs.map(d=>({id:d.id,...d.data()}));drawQ();drawD()},err("requests"));onSnapshot(collection(db,"cviews"),s=>{CVT=s.docs.reduce((t,d)=>t+(d.data().n||0),0);drawD()},err("cviews"));getDoc(doc(db,"site","counter")).then(s=>{VT=s.exists()?s.data().n:0;drawD()}).catch(()=>{})}
if(u){const s=await getDoc(ref);if(s.exists())S={...S,...s.data()};draw()}});
const DA={bismillah:"https://everyayah.com/data/Alafasy_128kbps/001001.mp3",base:"https://server8.mp3quran.net/afs/"};
$("au2").onclick=()=>{S.audio={bismillah:$("ab").value.trim(),base:$("as").value.trim()};save()};
function drawD(){const t0=new Date();t0.setHours(0,0,0,0);const c=x=>RQ.filter(r=>r.status===x).length;
const d=[["Users",MB.length],["New today",MB.filter(m=>m.ts>=t0.getTime()).length],["Courses",S.courses.length],["Course views",CVT],["Visitors",VT],["Requests",RQ.length],["Pending",c("pending")],["Approved",c("approved")],["Rejected",c("rejected")],["Completed",c("completed")],["Reviews",RV.length],["Pending reviews",RV.filter(r=>r.status!=="approved").length]];
$("dash").innerHTML=d.map(([l,v])=>`<div class="glass st"><b>${v}</b><span>${l}</span></div>`).join("")}
function drawQ(){const f=$("rf").value;$("rq").innerHTML=[...RQ].filter(r=>!f||r.status===f).sort((a,b)=>b.ts-a.ts).map(r=>`<div class="row" style="flex-wrap:wrap"><span><b>${esc(r.course)}</b> ${esc(r.price)}<br>${esc(r.name)} · ${esc(r.email)}<br><small>${esc(r.rid)} · ${new Date(r.ts).toLocaleString()} · <b>${esc(r.status)}</b><br>${(r.hist||[]).map(h=>esc(h.s)+" "+new Date(h.t).toLocaleDateString()).join(" → ")}</small></span>${["approved","rejected","completed"].filter(x=>x!==r.status).map(x=>`<button class="btn ${x==="approved"?"gold":""}" data-q="${x}" data-id="${esc(r.id)}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>`).join("")||"<small>No requests</small>"}
$("rf").onchange=drawQ;
document.addEventListener("click",async e=>{const b=e.target.closest("[data-q]");if(!b)return;const r=RQ.find(x=>x.id===b.dataset.id);if(!r)return;try{await updateDoc(doc(db,"requests",r.id),{status:b.dataset.q,hist:[...(r.hist||[]),{s:b.dataset.q,t:Date.now()}]})}catch(x){alert("Failed: "+x.code)}});
$("ka").onclick=async()=>{const n=$("kn").value.trim();if(!n)return;const id=editId||("c"+Date.now().toString(36)),old=S.courses.find(c=>c.id===id)||{};
const k={...old,id,name:n,short:$("ks").value,details:$("kdt").value,price:$("kp").value,old:$("ko").value,cat:$("kc").value.trim(),dur:$("kdu").value,level:$("kv").value,learn:$("klr").value,req:$("krq").value,thumb:$("kth").value.trim(),contact:$("kw").value,status:$("kst").value,featured:$("kf").checked,ts:old.ts||Date.now(),upd:Date.now()};
try{await setDoc(doc(db,"courseAccess",id),{link:$("kl").value.trim()})}catch(x){alert("Link save failed: "+x.code)}
S.courses=old.id?S.courses.map(c=>c.id===id?k:c):[...S.courses,k];editId=null;["kn","ks","kdt","kp","ko","kc","kdu","kv","klr","krq","kth","kl","kw"].forEach(i=>$(i).value="");$("kf").checked=false;$("kst").value="active";$("ka").textContent="Add Course";save()};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-ce],[data-ch],[data-cd]");if(!b)return;const id=b.dataset.ce||b.dataset.ch||b.dataset.cd,c=S.courses.find(x=>x.id===id);if(!c)return;
if(b.dataset.ch){c.status=c.status==="hidden"?"active":"hidden";return save()}
if(b.dataset.cd){if(!confirm("Delete this course?"))return;S.courses=S.courses.filter(x=>x.id!==id);try{await deleteDoc(doc(db,"courseAccess",id))}catch(x){}return save()}
editId=id;const m={kn:"name",ks:"short",kdt:"details",kp:"price",ko:"old",kc:"cat",kdu:"dur",kv:"level",klr:"learn",krq:"req",kth:"thumb",kw:"contact"};Object.entries(m).forEach(([i,f])=>$(i).value=c[f]||"");$("kst").value=c.status||"active";$("kf").checked=!!c.featured;
try{const x=await getDoc(doc(db,"courseAccess",id));$("kl").value=x.exists()?x.data().link:""}catch(x){$("kl").value=""}$("ka").textContent="Save changes";$("kn").scrollIntoView()});
function drawM(){const f=m=>`<div class="row"><span><b>${esc(m.name)}</b><br>${esc(m.email)} · ${esc(m.status)}</span>${m.status!=="approved"?`<button class="btn gold" data-m="ok" data-id="${m.id}">Approve</button>`:""}${m.status!=="rejected"?`<button class="btn" data-m="no" data-id="${m.id}">${m.status==="approved"?"Remove":"Reject"}</button>`:""}</div>`;
const P=MB.filter(m=>m.status==="pending");$("mp").innerHTML=`<b>Join requests (${P.length})</b>${P.map(f).join("")}<br><b>Other members (${MB.length-P.length})</b>${MB.filter(m=>m.status!=="pending").map(f).join("")}`}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;try{await updateDoc(doc(db,"members",b.dataset.id),{status:b.dataset.m==="ok"?"approved":"rejected"})}catch(x){alert("Failed: "+x.code)}});
function drawR(){const f=(r,p)=>`<div class="row"><span><b>${esc(r.name)}</b> ${"★".repeat(r.rating|0)}<br>${esc(r.text)}</span>${p?`<button class="btn gold" data-a="ok" data-id="${r.id}">Approve</button>`:""}<button class="btn" data-a="no" data-id="${r.id}">${p?"Reject":"🗑"}</button></div>`;
const P=RV.filter(r=>r.status!=="approved"),A=RV.filter(r=>r.status==="approved");
$("rp").innerHTML=`<b>Pending (${P.length})</b>${P.map(r=>f(r,1)).join("")}<br><b>Approved (${A.length})</b>${A.map(r=>f(r,0)).join("")}`}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=doc(db,"reviews",b.dataset.id);try{if(b.dataset.a==="ok")await updateDoc(d,{status:"approved"});else await deleteDoc(d)}catch(x){alert("Failed: "+x.code)}});
$("ba").onclick=()=>add("banners",{title:$("bt").value,text:$("bx").value,img:$("bi").value},["bt","bx","bi"]);
const add=(k,o,ids)=>{if(!o[Object.keys(o)[0]])return;S[k].push(o);ids.forEach(i=>$(i).value="");save()};
$("ta").onclick=()=>add("tilawat",{title:$("tt").value,url:$("tu").value},["tt","tu"]);
$("ca").onclick=()=>add("channels",{name:$("cn").value,url:$("cu").value,dp:$("cd").value},["cn","cu","cd"]);
$("sv").onclick=()=>{S.stats={used:+$("s1").value||0,seen:+$("s2").value||0,};save()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b){S[b.dataset.k].splice(+b.dataset.i,1);save()}});
</script></body></html>
