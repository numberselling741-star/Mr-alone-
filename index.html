<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mr Alone</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div class="bg"></div>
<div id="gate"><div class="glass"><div class="logo" style="margin-bottom:14px">✦ MR ALONE</div>
<div id="gform"><div class="f"><input id="gn" maxlength="40" placeholder="Your name (for joining)"><input id="ge" type="email" placeholder="Gmail / Email"><input id="gp" type="password" placeholder="Password (min 6)"><button class="btn gold" id="gl">Login</button><button class="btn" id="gs">Request to Join</button></div></div>
<div id="gwait" class="hide"><p id="gt" style="color:var(--m)"></p><button class="btn" id="go2">Logout</button></div><small id="gmsg" style="color:#ff8a8a"></small></div></div><div class="wrap">
<header class="glass"><div class="logo">✦ MR ALONE</div><div class="hd"><button class="btn ico" id="tb">🌓</button><button class="btn ico" id="sb">🔍</button></div></header>
<div id="sbar" class="glass"><input id="q" placeholder="Search…"></div>
<div id="bn"></div><h2>Tilawat-e-Quran Pak</h2><div class="glass quran"><div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="f" style="margin-top:14px"><div id="pt" style="color:var(--m);font-size:13px">Recitation</div><div class="hd" style="justify-content:center"><button class="btn" id="pv">⏮</button><button class="btn gold" id="pp">▶</button><button class="btn" id="pn">⏭</button></div><audio id="au" preload="none"></audio></div><div id="tl"></div></div>
<h2>Channels</h2><div class="grid" id="chs"></div>
<h2>Courses</h2><div class="hd" style="margin-bottom:12px"><select id="fc"><option value="">All categories</option></select><select id="fs"><option value="new">Newest</option><option value="views">Most viewed</option><option value="low">Price: low</option><option value="high">Price: high</option><option value="off">Discounted</option></select></div><div id="course"></div><h2>My Requests</h2><div id="mr"></div>
<h2>Reviews</h2><div id="rl"></div><div class="glass course"><div class="f"><input id="rn" maxlength="40" placeholder="Your name"><select id="rg"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><textarea id="rt" rows="3" maxlength="300" placeholder="Write your review"></textarea><button class="btn gold" id="rs">Submit review</button><small id="rmsg" style="color:var(--m)"></small></div></div><h2>Stats</h2><div class="stats" id="stats"></div><footer>© Mr Alone</footer></div>
<div id="dm" class="hide"><div class="glass"><div id="dmb"></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,getDoc,setDoc,updateDoc,increment,collection,query,where,getDocs,addDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^(https?:\/\/|tel:)/i.test(u||"")?u:"#";
let S={tilawat:[],channels:[],courses:[],banners:[],stats:{}},views=0,R=[],online=0,bi=0,CV={},MR=[],me=null,mem=null,unsubR=null,catSig="";
function rb(){const B=S.banners||[];if(!B.length){$("bn").innerHTML="";return}bi%=B.length;const b=B[bi],im=b.img&&safe(b.img)!=="#"?`,url('${encodeURI(b.img).replace(/'/g,"%27")}')`:"";
$("bn").innerHTML=`<div class="slide" style="background-image:linear-gradient(transparent,#000b)${esc(im)}"><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p></div><div class="dots">${B.map((_,i)=>`<i class="${i==bi?"on":""}"></i>`).join("")}</div>`}
function rr(){$("rl").innerHTML=[...R].sort((a,b)=>b.ts-a.ts).map(r=>`<div class="glass rv"><b>${esc(r.name)}</b> <span class="stars">${"★".repeat(r.rating|0)}</span><p style="margin:6px 0 0;color:var(--m)">${esc(r.text)}</p></div>`).join("")||`<div class="glass rv" style="color:var(--m)">No reviews yet.</div>`}
function num(v){return parseFloat(String(v||"").replace(/[^\d.]/g,""))||0}
function off(k){const p=num(k.price),o=num(k.old);return o>p&&p>0?Math.round((o-p)/o*100):0}
function vis(){return(S.courses||[]).filter(k=>k.status!=="hidden")}
function card(k){const o=off(k),th=k.thumb&&safe(k.thumb)!=="#"?`background-image:url('${esc(encodeURI(k.thumb).replace(/'/g,"%27"))}')`:"";
return `<div class="glass cc"><div class="th" style="${th}"></div><div class="cb"><h3 style="margin:0 0 6px">${esc(k.name)}</h3>${k.featured?'<span class="chip badge">Featured</span>':""}${o?`<span class="chip badge">-${o}%</span>`:""}${k.cat?`<span class="chip">${esc(k.cat)}</span>`:""}${k.level?`<span class="chip">${esc(k.level)}</span>`:""}${k.dur?`<span class="chip">${esc(k.dur)}</span>`:""}<p style="color:var(--m);margin:6px 0">${esc(k.short)}</p><div class="price">${esc(k.price)||"—"}${k.old?`<span class="old">${esc(k.old)}</span>`:""}</div><p style="font-size:12px;color:var(--m)">👁 ${CV[k.id]||0}</p><button class="btn gold" data-open="${esc(k.id)}">View details</button></div></div>`}
function rc(){const q=$("q").value.toLowerCase(),fs=$("fs").value,cats=[...new Set(vis().map(k=>k.cat).filter(Boolean))],sg=cats.join("|");
if(sg!==catSig){catSig=sg;const cur=$("fc").value;$("fc").innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("")}
const fc=$("fc").value;let L=vis().filter(k=>(!q||((k.name||"")+" "+(k.cat||"")+" "+(k.short||"")).toLowerCase().includes(q))&&(!fc||k.cat===fc)&&(fs!=="off"||off(k)>0));
L.sort((a,b)=>fs==="views"?(CV[b.id]||0)-(CV[a.id]||0):fs==="low"?num(a.price)-num(b.price):fs==="high"?num(b.price)-num(a.price):(b.ts||0)-(a.ts||0));
$("course").innerHTML=L.map(card).join("")||`<div class="glass course" style="color:var(--m)">No courses found.</div>`}
function rm(){$("mr").innerHTML=[...MR].sort((a,b)=>b.ts-a.ts).map(r=>`<div class="glass rv"><b>${esc(r.course)}</b> <span class="stt">${esc(r.status)}</span><p style="margin:6px 0;color:var(--m);font-size:12px">${esc(r.rid)} · ${new Date(r.ts).toLocaleDateString()} · ${esc(r.price)}</p>${r.status==="approved"||r.status==="completed"?`<button class="btn gold" data-acc="${esc(r.cid)}">Get course link</button>`:""}</div>`).join("")||`<div class="glass rv" style="color:var(--m)">No requests yet.</div>`}
function render(){const q=$("q").value.toLowerCase();rb();rr();
$("tl").innerHTML=S.tilawat.map(t=>`<a class="glass tr" href="${esc(safe(t.url))}" target="_blank" rel="noopener">▶ ${esc(t.title)}</a>`).join("");
$("chs").innerHTML=S.channels.filter(c=>c.name.toLowerCase().includes(q)).map(c=>`<a class="glass ch" href="${esc(safe(c.url))}" target="_blank" rel="noopener"><img class="dp" src="${esc(safe(c.dp))}" alt=""><b>${esc(c.name)}</b></a>`).join("");
rc();rm();
const t=S.stats||{};$("stats").innerHTML=[["Views",views],["Users",t.used],["Seen",t.seen],["Online",online],["Reviews",R.length]].map(([l,v])=>`<div class="glass st"><b>${Number(v||0).toLocaleString()}</b><span>${l}</span></div>`).join("")}
$("sb").onclick=()=>{$("sbar").classList.toggle("open");if(!$("sbar").classList.contains("open")){$("q").value="";render()}else $("q").focus()};
$("q").oninput=render;render();
const au=$("au");let pl=[],pi=0,wantAuto=false,playedOnce=false,userPaused=false,er=0;
const DEF={bismillah:"https://everyayah.com/data/Alafasy_128kbps/001001.mp3",base:"https://server8.mp3quran.net/afs/"};
function build(){const a={...DEF,...(S.audio||{})};pl=[{t:"Bismillah",u:a.bismillah}];
if(a.base){const b=a.base.endsWith("/")?a.base:a.base+"/";for(let i=1;i<=114;i++)pl.push({t:"Surah "+i+" of 114",u:b+String(i).padStart(3,"0")+".mp3"})}
else S.tilawat.forEach(x=>pl.push({t:x.title,u:x.url}));pl=pl.filter(x=>safe(x.u)!=="#")}
function load(i){if(!pl.length)return;pi=(i+pl.length)%pl.length;au.src=pl[pi].u;$("pt").textContent=pl[pi].t}
async function play(){if(!pl.length)return;if(!au.getAttribute("src"))load(pi);userPaused=false;try{await au.play();$("pp").textContent="⏸"}catch(e){$("pp").textContent="▶";$("pt").textContent="Tap ▶ to start recitation"}}
function stop(){if(unsubR){unsubR();unsubR=null}MR=[];me=null;mem=null;au.pause();au.removeAttribute("src");au.load();wantAuto=false;playedOnce=false;$("pp").textContent="▶"}
function kick(){if(wantAuto&&!playedOnce&&pl.length){playedOnce=true;play()}}
function onData(){const b=pl.length;build();if(!b||pi>=pl.length)pi=0;kick()}
au.onended=()=>{load(pi+1);play()};au.onplaying=()=>{er=0;$("pp").textContent="⏸";$("pt").textContent=pl[pi]?pl[pi].t:""};
au.onerror=()=>{if(au.getAttribute("src")&&++er<6){load(pi+1);play()}};
$("pp").onclick=()=>{if(au.paused)play();else{userPaused=true;au.pause();$("pp").textContent="▶"}};
$("pn").onclick=()=>{load(pi+1);play()};$("pv").onclick=()=>{load(pi-1);play()};
document.addEventListener("click",()=>{if(wantAuto&&au.paused&&!userPaused&&pl.length&&au.getAttribute("src")===null)play()});
const seenV=new Set();async function cvInc(id){if(seenV.has(id))return;seenV.add(id);const r=doc(db,"cviews",id);try{const x=await getDoc(r);if(x.exists())await updateDoc(r,{n:increment(1)});else await setDoc(r,{n:1})}catch(e){}}
function subReq(){if(unsubR||!me)return;unsubR=onSnapshot(query(collection(db,"requests"),where("uid","==",me.uid)),x=>{MR=x.docs.map(d=>d.data());render()},()=>{})}
async function reqC(id){const k=(S.courses||[]).find(x=>x.id===id);if(!k||!me||!mem)return;const ts=Date.now();
try{await setDoc(doc(db,"requests",me.uid+"_"+id),{uid:me.uid,name:mem.name||"",email:me.email||"",cid:id,course:k.name,price:k.price||"",status:"pending",rid:"REQ-"+ts.toString(36).toUpperCase(),ts,hist:[{s:"pending",t:ts}]})}catch(e){alert("Could not send request ("+e.code+")")}}
function openC(id){const k=(S.courses||[]).find(x=>x.id===id);if(!k)return;cvInc(id);const rq=MR.find(r=>r.cid===id),o=off(k);
const sec=(t,v)=>v?`<h2 style="margin:16px 0 6px">${t}</h2><div class="pre">${esc(v)}</div>`:"";
$("dmb").innerHTML=`<button class="btn" data-close="1" style="float:right">✕</button><h2 style="margin:0 0 8px;font-size:20px;letter-spacing:0">${esc(k.name)}</h2>`+(k.thumb&&safe(k.thumb)!=="#"?`<img src="${esc(safe(k.thumb))}" alt="" style="width:100%;border-radius:16px;margin-bottom:10px">`:"")+`<div>${k.cat?`<span class="chip">${esc(k.cat)}</span>`:""}${k.level?`<span class="chip">${esc(k.level)}</span>`:""}${k.dur?`<span class="chip">${esc(k.dur)}</span>`:""}</div><div class="price">${esc(k.price)||"—"}${k.old?`<span class="old">${esc(k.old)}</span>`:""}${o?` <span class="chip badge">-${o}%</span>`:""}</div><p class="pre">${esc(k.short)}</p>`+sec("Details",k.details)+sec("What you will learn",k.learn)+sec("Requirements",k.req)+`<p style="font-size:12px;color:var(--m)">👁 ${CV[id]||0} · Updated ${new Date(k.upd||k.ts||Date.now()).toLocaleDateString()}</p><div class="hd" style="flex-wrap:wrap">`+(rq?`<span class="stt">Your request: ${esc(rq.status)}</span>`:`<button class="btn gold" data-req="${esc(id)}">Request / Get Course</button>`)+`<button class="btn" data-share="1">Share</button>`+(k.contact?`<a class="btn" style="text-decoration:none" href="${esc(safe(k.contact))}" target="_blank" rel="noopener">Contact</a>`:"")+`</div>`;$("dm").classList.remove("hide")}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-open],[data-req],[data-share],[data-close],[data-acc]");if(!b)return;
if(b.dataset.open)openC(b.dataset.open);else if(b.dataset.close)$("dm").classList.add("hide");
else if(b.dataset.req){b.disabled=true;await reqC(b.dataset.req);openC(b.dataset.req)}
else if(b.dataset.share){try{if(navigator.share)await navigator.share({title:"Mr Alone",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Link copied")}}catch(x){}}
else if(b.dataset.acc){try{const x=await getDoc(doc(db,"courseAccess",b.dataset.acc)),l=x.exists()?x.data().link:"";if(safe(l)!=="#")b.outerHTML=`<a class="btn gold" style="text-decoration:none" href="${esc(safe(l))}" target="_blank" rel="noopener">Open Course</a>`;else alert("Link not available yet.")}catch(x){alert("Link not available yet.")}}});
$("fc").onchange=$("fs").onchange=render;
let started=false;const start=()=>{if(started)return;started=true;onSnapshot(collection(db,"cviews"),x=>{CV={};x.docs.forEach(d=>CV[d.id]=d.data().n);render()},()=>{});onSnapshot(doc(db,"site","main"),s=>{if(s.exists()){S={...S,...s.data()};render();onData()}},()=>{})};
let unsubM=null,signing=false;const gm=t=>{$("gmsg").textContent=t};
$("gl").onclick=()=>signInWithEmailAndPassword(auth,$("ge").value.trim(),$("gp").value).catch(e=>gm(e.code));
$("gs").onclick=async()=>{const n=$("gn").value.trim();if(!n)return gm("Please enter your name");signing=true;
try{const c=await createUserWithEmailAndPassword(auth,$("ge").value.trim(),$("gp").value);await setDoc(doc(db,"members",c.user.uid),{name:n.slice(0,40),email:c.user.email,status:"pending",ts:Date.now()})}catch(e){gm(e.code)}signing=false};
$("go2").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(unsubM){unsubM();unsubM=null}$("gate").classList.remove("hide");gm("");
if(!u){stop();$("gform").classList.remove("hide");$("gwait").classList.add("hide");return}
$("gform").classList.add("hide");$("gwait").classList.remove("hide");$("gt").textContent="Checking…";
unsubM=onSnapshot(doc(db,"members",u.uid),s=>{const st=s.exists()?s.data().status:"none";if(st!=="approved")stop();
if(st==="approved"){$("gate").classList.add("hide");me=u;mem=s.data();subReq();start();wantAuto=true;kick()}
else if(st==="none"){if(!signing)setDoc(doc(db,"members",u.uid),{name:"Member",email:u.email||"",status:"pending",ts:Date.now()}).catch(()=>{})}
else $("gt").textContent=st==="rejected"?"Your request was rejected by the admin.":"Your join request is sent. Please wait for admin approval. This page updates automatically."})});
const c=doc(db,"site","counter");
try{const s=await getDoc(c);if(s.exists())await updateDoc(c,{n:increment(1)});else await setDoc(c,{n:1});}catch(e){}
onSnapshot(c,s=>{views=s.exists()?s.data().n:0;render()});
setInterval(()=>{bi++;rb()},4000);
const setTh=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}};
let th0="dark";try{th0=localStorage.getItem("th")||"dark"}catch(e){}setTh(th0);
$("tb").onclick=()=>setTh(document.documentElement.dataset.theme==="dark"?"light":"dark");
onSnapshot(query(collection(db,"reviews"),where("status","==","approved")),s=>{R=s.docs.map(d=>d.data());render()},()=>{});
$("rs").onclick=async()=>{const n=$("rn").value.trim(),x=$("rt").value.trim();if(!n||!x)return;
try{await addDoc(collection(db,"reviews"),{name:n.slice(0,40),text:x.slice(0,300),rating:+$("rg").value,status:"pending",ts:Date.now()});$("rn").value=$("rt").value="";$("rmsg").textContent="Thank you! Your review will appear after approval."}catch(e){$("rmsg").textContent="Could not send review."}};
let vid;try{vid=localStorage.getItem("vid");if(!vid){vid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("vid",vid)}}catch(e){vid=Math.random().toString(36).slice(2)}
const beat=()=>setDoc(doc(db,"presence",vid),{t:Date.now()}).catch(()=>{});
const cnt=async()=>{try{online=(await getDocs(query(collection(db,"presence"),where("t",">",Date.now()-75000)))).size;render()}catch(e){}};
beat();cnt();setInterval(beat,30000);setInterval(cnt,30000);
</script></body></html>
